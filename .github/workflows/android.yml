name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --fix-missing \
            git zip unzip wget python3-pip \
            autoconf libtool libltdl-dev pkg-config zlib1g-dev \
            libncurses-dev libtinfo-dev \
            cmake libffi-dev libssl-dev automake \
            liblzma-dev libbz2-dev libreadline-dev \
            libglew-dev libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev \
            libmtdev-dev libswscale-dev libavformat-dev \
            libavdevice-dev libportmidi-dev libfreetype6-dev

      - name: Install buildozer
        run: |
          pip3 install buildozer cython virtualenv

      - name: Build debug APK
        continue-on-error: true
        run: |
          buildozer -v android debug 2>&1 | tee build.log
          echo "BUILDOZER_EXIT=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK artifact
        if: env.BUILDOZER_EXIT == '0'
        uses: actions/upload-artifact@v4
        with:
          name: astroflow-debug-apk
          path: ./bin/*.apk
          if-no-files-found: error

      - name: Fail if build failed
        if: env.BUILDOZER_EXIT != '0'
        run: |
          echo "Build failed with exit code $BUILDOZER_EXIT"
          tail -100 build.log
          exit 1


